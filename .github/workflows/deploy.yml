name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write Wrangler credentials
        run: |
          mkdir -p ~/.config/.wrangler/config
          cat > ~/.config/.wrangler/config/default.toml <<EOF
          oauth_token = "${{ secrets.CF_OAUTH_TOKEN }}"
          refresh_token = "${{ secrets.CF_REFRESH_TOKEN }}"
          EOF

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=cleansoo-site --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
