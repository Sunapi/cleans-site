name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Refresh Cloudflare OAuth token
        id: refresh
        run: |
          RESPONSE=$(curl -s -X POST https://dash.cloudflare.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.CF_REFRESH_TOKEN }}&client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Token refresh failed: $RESPONSE"
            # Fall back to stored token
            ACCESS_TOKEN="${{ secrets.CF_OAUTH_TOKEN }}"
          fi
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Write Wrangler credentials
        run: |
          mkdir -p ~/.config/.wrangler/config
          cat > ~/.config/.wrangler/config/default.toml <<EOF
          oauth_token = "${{ steps.refresh.outputs.access_token }}"
          refresh_token = "${{ secrets.CF_REFRESH_TOKEN }}"
          EOF

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=cleansoo-site --branch=main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
